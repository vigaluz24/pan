<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producción bloqueada - Pan en su Punto</title>
    <link rel="stylesheet" href="produccion.css">
</head>
<body class="dashboard-body">

    <div class="app-layout">
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <div class="sidebar-logo-section">
                <img src="../logo.jpeg.jpeg" alt="Logo" class="sidebar-logo" style="width: 100px; height: auto;">
            </div>
            <nav class="sidebar-menu">
                <a href="../dashboard.html" class="menu-item">🏠 Inicio</a>
                <a href="../ventas/ventas.html" class="menu-item">🛒 Ventas y POS</a>
                <a href="../inventario/inventario.html" class="menu-item">📦 Inventario</a>
                <a href="../recetas/recetas.html" class="menu-item">📋 Recetas</a>
                <a href="../produccion/produccion.html" class="menu-item active">🍞 Producción</a>
                <a href="../usuarios.html" class="menu-item">👥 Usuarios</a>
                <a href="../reportes/reportes.html" class="menu-item">📊 Reportes</a>
                <a href="../configuracion.html" class="menu-item">⚙️ Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html" class="menu-item logout-btn">🚪 Salir</a>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL MODAL -->
        <main class="main-content" style="padding: 40px; background: rgba(0,0,0,0.4); flex: 1; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
            
            <div style="background: white; width: 100%; max-width: 480px; border-radius: 16px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center;">
                
                <div style="background: #FADBD8; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; color: #C0392B; font-size: 24px; font-weight: bold;">⚠️</div>

                <h2 style="color: #67412E; font-size: 22px; font-weight: bold; margin-bottom: 5px;">Producción bloqueada</h2>
                <p style="color: #777; font-size: 12px; margin-bottom: 25px;">No se puede iniciar la orden por inventario insuficiente</p>

                <!-- Tarjeta del insumo faltante -->
                <div style="background: #FAF8F5; border-left: 4px solid #C0392B; border-radius: 8px; padding: 15px; text-align: left; margin-bottom: 25px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <strong style="color: #333; font-size: 14px;">Harina de trigo</strong>
                        <span style="background: #FADBD8; color: #C0392B; font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 4px;">Faltante</span>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                        <div style="background: white; border: 1px solid #EAE3D9; padding: 10px; border-radius: 6px;">
                            <span style="font-size: 10px; color: #777; display: block; font-weight: bold;">REQUERIDO</span>
                            <span style="font-size: 18px; font-weight: bold; color: #333;">50 <small style="font-size: 11px;">kg</small></span>
                        </div>
                        <div style="background: white; border: 1px solid #EAE3D9; padding: 10px; border-radius: 6px;">
                            <span style="font-size: 10px; color: #777; display: block; font-weight: bold;">DISPONIBLE</span>
                            <span style="font-size: 18px; font-weight: bold; color: #C0392B;">10 <small style="font-size: 11px;">kg</small></span>
                        </div>
                    </div>

                    <!-- Barra de progreso deficitario -->
                    <div style="width: 100%; background: #EAE3D9; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 8px;">
                        <div style="width: 20%; background: #C0392B; height: 100%;"></div>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; font-size: 10px; color: #777;">
                        <span>20% en stock</span>
                        <span style="color: #C0392B; font-weight: bold;">-40 kg faltantes</span>
                    </div>
                </div>

                <button onclick="window.location.href='produccion.html'" style="background: #D97706; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <span>✓</span> Entendido
                </button>

            </div>

        </main>
    </div>

</body>
</html>
